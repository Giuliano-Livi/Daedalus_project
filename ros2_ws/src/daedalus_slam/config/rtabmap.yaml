# Parametri dei nodi RTAB-Map (launch/slam.launch.py).
# I parametri della libreria RTAB-Map (es. RGBD/LinearUpdate) vanno scritti come stringhe.

# comuni a rgbd_odometry, rtabmap e rtabmap_viz
/**:
  ros__parameters:
    use_sim_time: true
    frame_id: base_link
    subscribe_depth: true
    subscribe_rgb: true
    # colore e depth sono due sensori gz distinti: sync approssimato
    approx_sync: true
    approx_sync_max_interval: 0.02
    wait_for_transform: 0.2
    # drone: 6DoF completi
    Reg/Force3DoF: "false"

# odometria visuale, solo con odom:=visual
/rgbd_odometry:
  ros__parameters:
    # pubblica /vo/odom (remap nel launch) solo per vision_to_px4 -> PX4; la TF odom -> base_link
    # e /odom per rtabmap li da' px4_odometry (EKF di PX4: IMU + visione, continuo anche quando la
    # visione si perde)
    odom_frame_id: vo_odom
    publish_tf: false
    # usa l'IMU (/imu/data, remap nel launch): parte solo dopo i primi dati IMU
    wait_imu_to_init: true
    Vis/MinInliers: "15"
    # (provati e tolti: Odom/Strategy 1 + Vis/CorType 1 optical flow + piu' feature GFTT davano
    # un'odometria molto peggiore, mappa e traiettoria sparse)
    # persa (es. muro senza texture davanti) -> reset al frame successivo: rtabmap apre una
    # nuova sessione di mappa e la riaggancia alla vecchia alla prima loop closure
    Odom/ResetCountdown: "1"

# graph SLAM
/rtabmap/rtabmap:
  ros__parameters:
    map_frame_id: map
    # nuovo nodo nel grafo ogni 10 cm o ~6 gradi
    RGBD/LinearUpdate: "0.1"
    RGBD/AngularUpdate: "0.1"
    RGBD/ProximityBySpace: "true"
    Vis/MinInliers: "15"
    # loop closure liberi di correggere il percorso passato anche di molto: ottimizzazione robusta
    # (Vertigo, funziona con GTSAM = Optimizer/Strategy 2 di default) che sotto-pesa da sola le
    # loop closure incoerenti col resto del grafo, al posto del rifiuto a soglia
    # (RGBD/OptimizeMaxError 3 rifiutava le correzioni grandi; 0 = disattivato, come consigliato
    # dalla documentazione con Optimizer/Robust). Nessun limite all'entita' della correzione
    # (RGBD/MaxLoopClosureDistance 0 = default)
    Optimizer/Robust: "true"
    RGBD/OptimizeMaxError: "0"
    RGBD/MaxLoopClosureDistance: "0"
    # loop closure e proximity rifinite con ICP sulla nuvola 3D della depth (point_cloud_xyz nel
    # launch, /rtabmap/scan_cloud): prima stima visiva, poi allineamento della struttura (montanti,
    # bordi degli scaffali). Piu' precise, e i match visivi sbagliati spesso non si allineano
    subscribe_scan_cloud: true
    Reg/Strategy: "2"                     # 0 = visiva, 1 = ICP, 2 = visiva + ICP
    Icp/VoxelSize: "0.05"
    Icp/RangeMax: "5.0"                   # come Vis/MaxDepth
    Icp/MaxCorrespondenceDistance: "0.15" # errore della depth ~5 cm a 5 m
    Icp/MaxTranslation: "0.5"             # correzione massima dell'ICP rispetto alla stima visiva
    Icp/CorrespondenceRatio: "0.2"        # almeno 20% di punti accoppiati (default 0.1): rifiuta i match sbagliati
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "10"
    Mem/LaserScanNormalK: "10"            # normali calcolate quando il nodo viene creato
    RGBD/ProximityPathMaxNeighbors: "10"  # proximity anche contro le nuvole unite di piu' nodi vicini
    # depth della ZED 2i (VGA) affidabile solo da vicino: errore ~6 cm a 5 m, ~13 cm a 7 m
    # (daedalus_camera/camera_noise); oltre, le feature non entrano nella registrazione delle
    # loop closure e nella mappa (l'odometria visuale usa invece tutta la depth, fino a 7 m)
    Vis/MaxDepth: "5.0"
    # mappa di occupazione dalla depth (/rtabmap/grid_prob_map 2D, /rtabmap/cloud_map 3D)
    # 1 = griglia dalla depth (nome nuovo di Grid/FromDepth): esplicito perche' con
    # subscribe_scan_cloud rtabmap passerebbe da solo alla nuvola (Grid/Sensor 0) togliendo Grid/RangeMax
    Grid/Sensor: "1"
    Grid/RangeMax: "5.0"
    Grid/CellSize: "0.1"
    # rimuove i punti isolati (outlier della depth) prima di costruire la griglia
    Grid/NoiseFilteringRadius: "0.15"
    Grid/NoiseFilteringMinNeighbors: "5"
    # Mem/IncrementalMemory e Mem/InitWMWithAllNodes (mapping / localizzazione) li imposta il
    # launch: un valore qui, specifico del nodo, avrebbe la precedenza su quello del launch

