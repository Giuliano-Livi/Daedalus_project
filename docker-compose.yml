services:
  sim:
    image: px4io/px4-sitl-gazebo:latest
    network_mode: host
    environment:
      PX4_SIM_MODEL: gz_x500_depth
      PX4_GZ_MODEL_POSE: ${PX4_GZ_MODEL_POSE:--10.2,-25,0,0,0,1.5708}
      PX4_GZ_WORLD: warehouse_px4
      PX4_PARAM_COM_RC_IN_MODE: "4"
      PX4_PARAM_COM_ARM_ODID: "0"
      PX4_PARAM_MC_YAWRATE_MAX: "30"   # deg/s
      PX4_PARAM_NAV_DLL_ACT: "0"
      # sorgente di posizione dell'EKF2: GPS (default) o visione (scripts/start.sh --no-gps, che
      # imposta le variabili sotto; la visione arriva da daedalus_slam/vision_to_px4 con odom:=visual)
      PX4_PARAM_SYS_HAS_GPS: "${PX4_SYS_HAS_GPS:-1}"
      PX4_PARAM_EKF2_GPS_CTRL: "${PX4_EKF2_GPS_CTRL:-7}"   # 7 = lat/lon + quota + velocita'
      PX4_PARAM_EKF2_HGT_REF: "${PX4_EKF2_HGT_REF:-1}"     # 1 = GPS, 0 = barometro
      PX4_PARAM_EKF2_EV_CTRL: "${PX4_EKF2_EV_CTRL:-0}"     # bit 0 pos. orizzontale, 1 verticale, 2 velocita'
      # il client DDS di PX4 timbra la visione all'arrivo: ritardo immagine -> PX4 (~60 ms odometria
      # + ~30 ms camera_noise)
      PX4_PARAM_EKF2_EV_DELAY: "${PX4_EKF2_EV_DELAY:-0}"
      # scripts/start.sh --vio (OpenVINS): niente bussola, yaw e quota dalla visione, varianze di OpenVINS
      # con questi minimi, modello di drag del multirotore (MCOEF da scripts/odom_eval/fit_drag.py).
      # Senza --vio restano i default di PX4
      PX4_PARAM_SYS_HAS_MAG: "${PX4_SYS_HAS_MAG:-1}"
      PX4_PARAM_EKF2_MAG_TYPE: "${PX4_EKF2_MAG_TYPE:-0}"                # 5 = nessuna fusione del magnetometro
      PX4_PARAM_EKF2_EVP_NOISE: "${PX4_EKF2_EVP_NOISE:-0.1}"             # m
      PX4_PARAM_EKF2_EVV_NOISE: "${PX4_EKF2_EVV_NOISE:-0.1}"             # m/s
      PX4_PARAM_EKF2_EVA_NOISE: "${PX4_EKF2_EVA_NOISE:-0.1}"             # rad
      PX4_PARAM_EKF2_DRAG_CTRL: "${PX4_EKF2_DRAG_CTRL:-0}"
      PX4_PARAM_EKF2_MCOEF: "${PX4_EKF2_MCOEF:-0.15}"                    # 1/s
      PX4_PARAM_EKF2_BCOEF_X: "${PX4_EKF2_BCOEF_X:-100}"                 # kg/m^2, 0 = drag quadratico spento
      PX4_PARAM_EKF2_BCOEF_Y: "${PX4_EKF2_BCOEF_Y:-100}"
      # declinazione: il magnetometro simulato da PX4 ha ~0 deg (misurato a drone fermo verso nord:
      # componente est ~0), il default EKF2_MAG_DECL = 0 e' gia' giusto anche senza GPS
      HEADLESS: "1"
      GZ_PARTITION: warehouse
    stdin_open: true
    tty: true
    volumes:
      - ./gazebo/worlds/warehouse_px4.sdf:/opt/px4-gazebo/share/gz/worlds/warehouse_px4.sdf:ro
      - ./gazebo/models/aws_robomaker_warehouse_GroundB_01:/opt/px4-gazebo/share/gz/models/aws_robomaker_warehouse_GroundB_01:ro
      - ./gazebo/models/warehouse_line_1:/opt/px4-gazebo/share/gz/models/warehouse_line_1:ro
      - ./gazebo/models/warehouse_line_2:/opt/px4-gazebo/share/gz/models/warehouse_line_2:ro
      - ./gazebo/models/warehouse_line_3:/opt/px4-gazebo/share/gz/models/warehouse_line_3:ro
      - ./gazebo/models/warehouse_zone_4:/opt/px4-gazebo/share/gz/models/warehouse_zone_4:ro
      # pareti con le facce interne texturizzate (scripts/gen_warehouse_textures.py)
      - ./gazebo/models/warehouse_walls:/opt/px4-gazebo/share/gz/models/warehouse_walls:ro
      # pavimento texturizzato con la segnaletica del layout (sostituisce GroundB_01 nel world)
      - ./gazebo/models/warehouse_floor:/opt/px4-gazebo/share/gz/models/warehouse_floor:ro
      # tetto a 9 m con travi e arcarecci
      - ./gazebo/models/warehouse_roof:/opt/px4-gazebo/share/gz/models/warehouse_roof:ro
      # lampade LED + tutte le luci in un solo modello (un'unica entita' nella GUI)
      - ./gazebo/models/warehouse_lights:/opt/px4-gazebo/share/gz/models/warehouse_lights:ro
      # drone: override of PX4's stock x500_depth with a ZED 2i (colour + ideal depth, ZED SDK output)
      - ./gazebo/models/x500_depth:/opt/px4-gazebo/share/gz/models/x500_depth:ro
    devices:
      - /dev/dri:/dev/dri

  dev:
    image: warehouse-drone:humble
    network_mode: host
    ipc: host
    environment:
      GZ_PARTITION: warehouse
      # finestre (RViz2) sul desktop dell'host
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      # shared memory grande per le immagini (vedi docker/ros/fastdds.xml)
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds.xml
    volumes:
      - ./ros2_ws/src:/ws/src
      - ./docker/ros/fastdds.xml:/etc/fastdds.xml:ro
      # cartella condivisa con l'host (./images), es. per copiare fuori rtabmap.db e gli export
      - ./images:/ws/images
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    devices:
      - /dev/dri:/dev/dri
    working_dir: /ws
    stdin_open: true
    tty: true

  agent:
    build: ./docker/ros
    image: warehouse-drone:humble
    network_mode: host
    ipc: host
    command: MicroXRCEAgent udp4 -p 8888